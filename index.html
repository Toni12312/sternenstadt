<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<title>Sternenstadt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a4a;font-family:'Baloo 2',system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;color:#2b2140}
button{font-family:inherit;cursor:pointer;border:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#topbar{flex:none;height:60px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(90deg,#7c3aed,#db2777);color:#fff;box-shadow:0 2px 8px #0004;z-index:20}
#title{flex:1;font-weight:800;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{background:#ffffff33;color:#fff;border-radius:16px;height:44px;padding:0 14px;font-size:18px;font-weight:700;white-space:nowrap}
.tbtn:active{transform:scale(.95)}
#friendBtn.on{background:#10b981}
.bigemo{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:min(30vw,200px);z-index:120;pointer-events:none;animation:bigemo 2.2s forwards}
@keyframes bigemo{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}
#clock{background:#fff;color:#7c3aed;border-radius:16px;height:44px;padding:0 12px;display:flex;align-items:center;font-weight:800;font-size:18px;white-space:nowrap}
#clock.low{background:#fde047;color:#7c2d12}
#stage{flex:1;position:relative;overflow:hidden;isolation:isolate}
#bottombar{flex:none;height:78px;display:flex;justify-content:center;align-items:center;gap:10px;padding:6px;background:#fff;box-shadow:0 -2px 8px #0003;z-index:20}
.bbtn{flex:1;max-width:190px;height:62px;border-radius:20px;font-size:18px;font-weight:800;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;box-shadow:0 4px 0 #0002}
.bbtn span{font-size:26px}
.bbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #0002}
.c1{background:#f97316}.c2{background:#8b5cf6}.c3{background:#10b981}.c4{background:#0ea5e9}
#mapScroll{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#8fd16a}
#ground{position:absolute;inset:0;width:100%;height:100%;display:block}
#world{position:absolute;inset:0;--u:3.1px}
#world .ent,#world .mitem,#world .bld{transform:translate(-50%,-100%) scale(var(--k,1));transform-origin:50% 100%}
.sea{position:absolute;left:0;right:0;bottom:0;height:170px;background:repeating-radial-gradient(circle at 30% 120%,#ffffff22 0 6px,transparent 6px 26px),linear-gradient(#5bc0eb,#2380c9)}
.sand{position:absolute;left:0;right:0;bottom:165px;height:80px;background:#f3dea0;border-radius:50% 50% 0 0/30px 30px 0 0}
.paths{position:absolute;inset:0;pointer-events:none}
.bld{position:absolute;touch-action:none}
.bld svg{display:block;filter:drop-shadow(0 4px 3px #0003)}
.bld .bsv{transition:transform .15s}
.bld.press .bsv{transform:scale(.97);transition:transform .55s}
.bld.lifted .bsv{transform:translateY(-14px);animation:wiggleB .35s infinite}
.bld.lifted svg{filter:drop-shadow(0 18px 10px #0005)}
@keyframes wiggleB{0%,100%{transform:translateY(-14px) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
.blabel{position:absolute;top:100%;left:50%;transform:translateX(-50%);background:#fffd;border-radius:10px;padding:0 8px;font-weight:800;font-size:14px;white-space:nowrap;margin-top:2px}
.badge{position:absolute;top:-6px;right:-6px;background:#ec4899;color:#fff;border-radius:14px;padding:0 8px;font-weight:800;font-size:15px;border:2px solid #fff}
.mitem{position:absolute;transform:translate(-50%,-100%);touch-action:none;line-height:1}
#roomWrap{position:absolute;inset:0;display:none;padding:8px;background:#3b2a63}
#room{position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;box-shadow:inset 0 0 0 4px #0002}
#room{background:#fffaf2}
.w3{position:absolute;inset:0}
.ceil{clip-path:polygon(0 0,100% 0,100% 27%,80% 4%,20% 4%,0 27%);background:linear-gradient(#f5ede0,#fffaf2)}
.wallB{clip-path:polygon(20% 4%,80% 4%,80% 48%,20% 48%)}
.wallL{clip-path:polygon(0 27%,20% 4%,20% 48%,0 100%)}
.wallR{clip-path:polygon(100% 27%,80% 4%,80% 48%,100% 100%)}
.w3::after{content:'';position:absolute;inset:0}
.wallB::after{background:linear-gradient(#0000 75%,#0000001f)}
.wallL::after{background:linear-gradient(90deg,#00000052,#0000001a)}
.wallR::after{background:linear-gradient(270deg,#00000052,#0000001a)}
#floor3d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#room .item,#room .big,#room .ent,#room .fix{transform:translate(-50%,-100%) scale(var(--k,1));transform-origin:50% 100%}
#room .big.flp{transform:translate(-50%,-100%) scale(var(--k,1)) scaleX(-1)}
#room .ent .art,#room .item.onfloor,#room .big.onfloor{filter:drop-shadow(0 calc(var(--u)*.7) calc(var(--u)*.5) #0000004d)}
#room .ent.sel .art{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 6px #facc15)}
#room .big.m3,.mitem.m3{pointer-events:none}
.mitem.m3 svg *{pointer-events:visiblePainted}
.mitem.m3{filter:drop-shadow(0 3px 2px #0003)}
#room .big.m3 svg *{pointer-events:visiblePainted}
#room .ent.walking{transition-property:left,top,transform}
#rl{position:absolute;inset:0}
#roomLabel{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#fffe;border-radius:14px;padding:2px 14px;font-weight:800;font-size:17px;z-index:3000;white-space:nowrap;box-shadow:0 2px 6px #0002;pointer-events:none}
.item{position:absolute;transform:translate(-50%,-100%);touch-action:none;line-height:1}
.item.emo{text-align:center}
.flipx{transform:scaleX(-1)}
.ent{position:absolute;transform:translate(-50%,-100%);touch-action:none}
.ent .pose{transform-origin:50% 100%;transition:transform .3s}
.ent .art{line-height:1;text-align:center;position:relative}
.ent .art.fl{transform:scaleX(-1)}
.ent .nm{position:absolute;top:100%;left:50%;transform:translateX(-50%);background:#fffd;border-radius:8px;padding:0 6px;font-size:max(11px,calc(var(--u)*2.3));font-weight:800;white-space:nowrap;pointer-events:none}
.ent .zz{position:absolute;left:60%;top:-10%;font-size:calc(var(--u)*5);display:none;animation:zz 2s infinite;pointer-events:none}
.ent.sleep .zz{display:block}
.ent.sleep.person .pose{transform:translate(calc(var(--fh) * .45),calc(var(--fh) * -.3)) rotate(-90deg)}
.ent.sleep.person.sr .pose{transform:translate(calc(var(--fh) * -.45),calc(var(--fh) * -.3)) rotate(90deg)}
.ent.sleep.animal .pose{transform:scaleY(.85)}
.ent .deco{position:absolute;right:-10%;top:-12%;font-size:45%}
.ent.sel .art{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 6px #facc15)}
.ent .shd{position:absolute;left:50%;bottom:calc(var(--u) * -1.2);width:90%;min-width:calc(var(--u)*6);height:calc(var(--u)*3);transform:translateX(-50%);background:radial-gradient(closest-side,#00000059,#0000);pointer-events:none}
.ent.sleep.person .shd{display:none}
#room .ent .art{filter:none}
.ent .pose{perspective:420px}
.ent .bz{transition:transform .25s;transform-origin:50% 60%}
.ent .br{display:inline-block;transform-origin:50% 100%;animation:breathe 2.8s ease-in-out infinite}
.ent.sleep .br{animation-duration:4.6s}
.legL{transform-box:view-box;transform-origin:43px 99px}.legR{transform-box:view-box;transform-origin:57px 99px}.armL{transform-box:view-box;transform-origin:35.5px 51px}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.ent.sleep .eyes{transform:scaleY(.12);animation:none}
.ent.walking .legL{animation:swingA .42s infinite}.ent.walking .legR{animation:swingB .42s infinite}
.ent.walking .armL{animation:armA .42s infinite}.ent.walking .armR{animation:armB .42s infinite}
.ent.person.walking .pose{animation:bob .21s infinite}
.ent.animal .art{transition:transform .3s}
.ent.animal.walking .pose{animation:waddle .3s infinite}
.capyleg{transform-box:view-box}
.ent.walking .capyleg.a{animation:capyA .38s infinite ease-in-out}.ent.walking .capyleg.b{animation:capyB .38s infinite ease-in-out}
.ent.walking .art svg[data-noshade]{animation:capyBob .19s infinite}
@keyframes capyA{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes capyB{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes capyBob{50%{transform:translateY(-1.5%)}}
.ent.held .pose{animation:wiggle .28s infinite}
.ent.held .legL{animation:swingA .3s infinite}.ent.held .legR{animation:swingB .3s infinite}
.ent.dance .armL{animation:upL .5s infinite}.ent.dance .armR{animation:upR .5s infinite}.ent.dance .legL{animation:swingA .5s infinite}
.ent.happy .armL{transform:rotate(150deg);transition:transform .2s}.ent.happy .armR{transform:rotate(-150deg);transition:transform .2s}
.ent.happy .pose,.ent.jump .pose{animation:jump .62s 2}
.ent.animal.spin .bz{animation:turnA 1s ease-in-out}
@keyframes turnA{0%{transform:scaleX(1)}25%{transform:scaleX(.12) scaleY(1.03)}50%{transform:scaleX(-1)}75%{transform:scaleX(.12) scaleY(1.03)}100%{transform:scaleX(1)}}
.ent.roll .bz{animation:roll .8s ease-in-out}
.ent.sing .pose{animation:sway 1.2s ease-in-out infinite}.ent.sing .armR{transform:rotate(-70deg)}
.ent.look .bz{animation:look 1.6s ease-in-out}
.ent.sit .legL,.ent.sit .legR{transform:scaleY(.42)}
.ent.sit .pose{transform:translateY(24%)}
.ent.sit.floor .legL,.ent.sit.floor .legR{transform:scaleY(.25)}
.ent.sit.floor .pose{transform:translateY(36%)}
.ent.sit.walking .legL,.ent.sit.walking .legR{transform:none}
.ent.swim .bz{clip-path:inset(-20% -20% 50% -20%)}
.ent.animal.swim .bz{clip-path:inset(-20% -20% 38% -20%)}
.ent.swim .pose{animation:swimbob 1.5s ease-in-out infinite}
.ent.animal.swim .pose{animation:swimbobA 1.5s ease-in-out infinite}
.ent.person.swim .armL{animation:crawl 1.3s linear infinite}.ent.person.swim .armR{animation:crawl 1.3s linear infinite;animation-delay:-.65s}
.ent.swim .shd{background:radial-gradient(closest-side,#ffffffdd,#bae6fd99 55%,#0000);height:calc(var(--u)*3.4);bottom:calc(var(--u)*.2);animation:ripple 1.5s ease-in-out infinite}
.ent.swim .nm{display:none}
.ent.eat .armR{animation:eatArm .5s 4 ease-in-out}
.bubble{position:absolute;z-index:4200;pointer-events:none;background:#fff;border-radius:16px;padding:1px 9px;box-shadow:0 3px 8px #0003;transform:translate(-50%,-100%);animation:bubin .25s ease-out,bubout .35s 2s forwards;line-height:1.25;white-space:nowrap;font-weight:800}
.bubble::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bubin{from{transform:translate(-50%,-80%) scale(.3);opacity:0}}
@keyframes bubout{to{transform:translate(-50%,-130%) scale(.8);opacity:0}}
@keyframes swimbob{0%,100%{transform:translateY(47%)}50%{transform:translateY(41%)}}
@keyframes swimbobA{0%,100%{transform:translateY(34%) rotate(-3deg)}50%{transform:translateY(29%) rotate(3deg)}}
@keyframes crawl{to{transform:rotate(-360deg)}}
@keyframes ripple{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.3)}}
@keyframes eatArm{50%{transform:rotate(-145deg)}}
@keyframes breathe{50%{transform:scaleY(1.03) scaleX(.99)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes swingA{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
@keyframes swingB{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
@keyframes armA{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
@keyframes armB{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
@keyframes upL{0%,100%{transform:rotate(150deg)}50%{transform:rotate(100deg)}}
@keyframes upR{0%,100%{transform:rotate(-100deg)}50%{transform:rotate(-150deg)}}
@keyframes waddle{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-7%)}}
@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes jump{0%{transform:none}18%{transform:scaleY(.82) scaleX(1.08)}48%{transform:translateY(-42%) scaleY(1.06)}78%{transform:scaleY(.9) scaleX(1.05)}100%{transform:none}}
@keyframes spin3d{to{transform:rotateY(360deg)}}
@keyframes roll{to{transform:rotate(-360deg)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes look{0%,100%{transform:none}30%{transform:rotateY(35deg)}70%{transform:rotateY(-35deg)}}
.ent.walking .pose{animation:bob .32s infinite}
.ent.dance .pose{animation:dance .5s infinite}
.ent.hop .pose{animation:hop .4s 3}
.ent.wave .armR{animation:wave .35s 6}
.armR{transform-box:view-box;transform-origin:64.5px 51px}
@keyframes bob{50%{transform:translateY(-6%)}}
@keyframes dance{25%{transform:rotate(-10deg) translateY(-4%)}75%{transform:rotate(10deg) translateY(-4%)}}
@keyframes hop{50%{transform:translateY(-22%)}}
@keyframes wave{50%{transform:rotate(-120deg)}}
@keyframes zz{0%{opacity:0;transform:translateY(0)}50%{opacity:1}100%{opacity:0;transform:translateY(-60%)}}
.float{position:absolute;pointer-events:none;z-index:4000;animation:floatup 1.4s forwards;transform:translate(-50%,-100%)}
@keyframes floatup{to{opacity:0;margin-top:-80px}}
.pop{animation:popin .35s}
@keyframes popin{0%{scale:.3}70%{scale:1.15}100%{scale:1}}
/* fixtures */
.fix{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:flex-start;justify-content:center;font-weight:800;color:#fff;text-shadow:0 1px 2px #0008}
.fix .lb{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fffe;color:#3b2a63;text-shadow:none;border-radius:10px;padding:0 8px;font-size:max(12px,calc(var(--u)*2.6));white-space:nowrap;margin-bottom:2px;box-shadow:0 1px 4px #0003}
.door{background:linear-gradient(90deg,#9a6334,#7a4a22);border-radius:calc(var(--u)*5) calc(var(--u)*5) 4px 4px;border:calc(var(--u)*.6) solid #5b3415}
.door::after{content:'';position:absolute;right:16%;top:52%;width:12%;aspect-ratio:1;border-radius:50%;background:#fde047}
.door.green{background:linear-gradient(90deg,#34d399,#059669);border-color:#065f46}
.lift{background:linear-gradient(#a8b3c4,#8492a6);border:calc(var(--u)*.7) solid #64748b;border-radius:calc(var(--u)*1.2) calc(var(--u)*1.2) 2px 2px;box-shadow:0 0 0 calc(var(--u)*.4) #cbd5e1 inset}
.lift .ind{position:absolute;left:50%;top:1%;transform:translateX(-50%);background:#111827;color:#f87171;font-family:monospace;font-weight:800;font-size:calc(var(--u)*3.4);line-height:1.15;padding:0 calc(var(--u)*1);border-radius:3px;text-shadow:0 0 4px #f87171}
.lift .lin{position:absolute;left:6%;right:6%;top:13%;bottom:0;overflow:hidden;background:radial-gradient(circle at 50% 20%,#fff7d6,#fde68a)}
.lift .ld{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#e5e7eb,#cbd5e1 70%,#9ca3af);transition:transform .55s ease-in-out}
.lift .ld.l{left:0;border-right:1px solid #6b7280}.lift .ld.r{right:0;transform:scaleX(-1)}
.lift.open .ld.l{transform:translateX(-100%)}.lift.open .ld.r{transform:translateX(100%) scaleX(-1)}
.lift .lbtn{position:absolute;right:-30%;top:45%;width:18%;height:14%;background:#475569;border-radius:3px;box-shadow:inset 0 0 0 2px #94a3b8}
.lift .lbtn::after{content:'';position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:#facc15;box-shadow:0 0 4px #facc15}
.stairs .steps{position:absolute;inset:0;background:repeating-linear-gradient(180deg,#c08552 0 14%,#8b5a2b 14% 17%);clip-path:polygon(0 100%,0 85%,17% 85%,17% 68%,34% 68%,34% 51%,51% 51%,51% 34%,68% 34%,68% 17%,85% 17%,85% 0,100% 0,100% 100%)}
.stairs.down .steps{transform:scaleX(-1)}
/* big furniture */
.big{position:absolute;transform:translate(-50%,-100%);touch-action:none}
.big>i{position:absolute;display:block}
.tod-night .big-window .glass,.tod-night .glass{background:linear-gradient(#0b1440,#24306b)!important}
.tod-evening .glass{background:linear-gradient(#fb923c,#f9a8d4)!important}
/* overlays */
#todOverlay{position:absolute;inset:0;pointer-events:none;transition:background .8s;z-index:5000}
.tod-morning #todOverlay{background:#ffb47a22}
.tod-evening #todOverlay{background:#ff6a3a33}
.tod-night #todOverlay{background:#0b1650aa}
.tod-night.inroom #todOverlay{background:#0b165066}
.win{fill:#bfe6ff;transition:fill .8s}
.tod-evening .win{fill:#ffe39a}
.tod-night .win{fill:#ffd54a}
.tod-night .glow{filter:drop-shadow(0 0 10px #ffd54a) drop-shadow(0 0 22px #ffb300);z-index:5001!important}
/* wallpapers */
.wp-cream{background:repeating-linear-gradient(90deg,#fff4df 0 30px,#fdebcd 30px 34px)}
.wp-pink{background:repeating-linear-gradient(90deg,#ffd6e7 0 26px,#ffe8f1 26px 52px)}
.wp-mint{background:radial-gradient(#a7f3d0 3px,transparent 3.5px) 0 0/26px 26px,#dcfce7}
.wp-blue{background:radial-gradient(#ffffff 3px,transparent 3.5px) 0 0/30px 30px,#cfe6ff}
.wp-lilac{background:repeating-linear-gradient(90deg,#ede4ff 0 22px,#ddd0ff 22px 26px)}
.wp-yellow{background:radial-gradient(#fde68a 4px,transparent 4.5px) 0 0/28px 28px,#fff8d6}
.wp-wood{background:repeating-linear-gradient(0deg,#c99563 0 22px,#b9834f 22px 24px)}
.wp-brick{background:linear-gradient(#ffffff55 2px,transparent 2px) 0 0/40px 20px,linear-gradient(90deg,#ffffff55 2px,transparent 2px) 0 0/40px 40px,linear-gradient(90deg,#ffffff55 2px,transparent 2px) 20px 20px/40px 40px,#c8553d}
.wp-tile{background:linear-gradient(#cfe3ea 2px,transparent 2px) 0 0/34px 34px,linear-gradient(90deg,#cfe3ea 2px,transparent 2px) 0 0/34px 34px,#f6fbfd}
.wp-sky{background:radial-gradient(ellipse 60px 22px at 20% 30%,#fff 60%,transparent 62%),radial-gradient(ellipse 80px 26px at 70% 22%,#fff 60%,transparent 62%),linear-gradient(#7cc8ff,#cdeeff)}
.wp-stars{background:radial-gradient(#fff 1.5px,transparent 2px) 0 0/36px 36px,radial-gradient(#f0abfc 1.5px,transparent 2px) 18px 18px/36px 36px,linear-gradient(#2e1065,#581c87)}
.wp-sea{background:linear-gradient(transparent 70%,#38bdf8 70%,#0284c7),radial-gradient(ellipse 70px 22px at 25% 25%,#fff 60%,transparent 62%),linear-gradient(#7cc8ff,#d8f2ff)}
.wp-hedge{background:radial-gradient(circle at 30% 30%,#6cc24a 18%,transparent 19%) 0 0/26px 26px,radial-gradient(circle at 70% 60%,#4fa83a 20%,transparent 21%) 0 0/30px 30px,#3f8f2f}
.wp-peach{background:repeating-linear-gradient(45deg,#ffe4d4 0 18px,#ffd8c2 18px 36px)}
.wp-green{background:repeating-linear-gradient(90deg,#d9f99d 0 24px,#ecfccb 24px 48px)}
.fl-wood{background:repeating-linear-gradient(90deg,#d9a066 0 70px,#c88d55 70px 72px),#d9a066}
.fl-tile{background:conic-gradient(#fff 25%,#e2e8f0 0 50%,#fff 0 75%,#e2e8f0 0) 0 0/50px 50px}
.fl-carpet{background:radial-gradient(#f9a8d4 2px,transparent 2.5px) 0 0/16px 16px,#fbcfe8}
.fl-bluecarpet{background:radial-gradient(#93c5fd 2px,transparent 2.5px) 0 0/16px 16px,#bfdbfe}
.fl-grass{background:radial-gradient(#6fbf4a 2px,transparent 2.5px) 0 0/20px 20px,#8fd16a}
.fl-sand{background:radial-gradient(#e5c77c 1.5px,transparent 2px) 0 0/14px 14px,#f3dea0}
.fl-stone{background:linear-gradient(#0001 2px,transparent 2px) 0 0/60px 40px,linear-gradient(90deg,#0001 2px,transparent 2px) 0 0/60px 40px,#d6d3d1}
.fl-deck{background:repeating-linear-gradient(90deg,#b07a46 0 40px,#8d5d31 40px 43px)}
.fl-dark{background:repeating-linear-gradient(90deg,#4c1d95 0 50px,#3b0764 50px 52px)}
.fl-water{background:conic-gradient(#e0f7ff 25%,#bae6fd 0 50%,#e0f7ff 0 75%,#bae6fd 0) 0 0/40px 40px}
.fl-hay{background:repeating-linear-gradient(20deg,#f2d27a 0 6px,#e8c35e 6px 9px)}
.fl-mint{background:conic-gradient(#ecfdf5 25%,#a7f3d0 0 50%,#ecfdf5 0 75%,#a7f3d0 0) 0 0/50px 50px}
/* drawer */
#drawer{position:absolute;left:0;right:0;bottom:78px;height:min(48%,380px);background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 20px #0004;z-index:30;display:none;flex-direction:column}
#drawer.open{display:flex}
.dhead{display:flex;align-items:center;gap:6px;padding:8px 10px 4px;overflow-x:auto;flex:none;scrollbar-width:none}
.dhead::-webkit-scrollbar{display:none}
.tab{flex:none;background:#f3e8ff;color:#6b21a8;border-radius:14px;height:42px;padding:0 14px;font-size:17px;font-weight:800}
.tab.on{background:#7c3aed;color:#fff}
.dclose{flex:none;margin-left:auto;background:#fee2e2;color:#b91c1c;border-radius:50%;width:44px;height:44px;font-size:22px}
.dgrid{flex:1;overflow-y:auto;padding:8px 10px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;align-content:start}
.dgrid.wide{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.cell{background:#faf5ff;border-radius:16px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;font-weight:700;font-size:13px;line-height:1.1;text-align:center;border:2px solid #ede9fe}
.cell:active{transform:scale(.94);background:#ede9fe}
.cell .ic{font-size:40px;line-height:1.1}
.cell svg{width:100%;height:64px}
.cell.newp{background:#fdf2f8;border-color:#f9a8d4;color:#be185d;font-size:16px}
.sw{width:100%;height:60px;border-radius:12px;border:2px solid #0001}
/* action bar */
#actionBar{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;border-radius:22px;box-shadow:0 6px 20px #0005;display:none;align-items:center;gap:6px;padding:6px 8px;z-index:40;max-width:96vw;overflow-x:auto}
#actionBar.open{display:flex}
#actionBar .an{font-weight:800;padding:0 6px;white-space:nowrap}
.ab{width:52px;height:52px;border-radius:16px;background:#f3e8ff;font-size:26px;flex:none}
.ab:active{transform:scale(.9)}
#trash{position:absolute;right:18px;bottom:96px;width:84px;height:84px;border-radius:50%;background:#fee2e2;border:4px dashed #ef4444;font-size:40px;display:none;align-items:center;justify-content:center;z-index:45}
#trash.show{display:flex}
#trash.hot{background:#ef4444;transform:scale(1.15)}
#toast{position:absolute;left:50%;top:118px;transform:translateX(-50%);background:#1f1235ee;color:#fff;border-radius:16px;padding:8px 18px;font-weight:700;font-size:17px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:90vw}
#toast.show{opacity:1}
/* modal + screens */
.overlay{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:#1f1235cc;padding:12px}
#dialog{z-index:95}
.overlay.open{display:flex}
.card{background:#fff;border-radius:28px;padding:22px;max-width:520px;width:100%;text-align:center;box-shadow:0 10px 40px #0006;max-height:100%;overflow-y:auto}
.card h1{margin:0;font-size:40px;color:#7c3aed;line-height:1.1}
.card h2{margin:0 0 6px;color:#7c3aed}
.card p{font-size:18px;margin:8px 0}
.logo{font-size:64px;line-height:1}
.timebox{background:#faf5ff;border-radius:18px;padding:10px;margin:12px 0;font-size:19px;font-weight:700}
.bigbtn{display:block;width:100%;border-radius:20px;padding:14px;font-size:22px;font-weight:800;margin-top:10px;color:#fff;background:#10b981;box-shadow:0 5px 0 #047857}
.bigbtn.b2{background:#f59e0b;box-shadow:0 5px 0 #b45309}
.bigbtn.b3{background:#8b5cf6;box-shadow:0 5px 0 #5b21b6}
.bigbtn.b4{background:#e5e7eb;color:#374151;box-shadow:0 5px 0 #9ca3af}
.bigbtn small{display:block;font-size:15px;font-weight:600;opacity:.9}
.rules{text-align:left;font-size:17px}
.rules li{margin:6px 0}
/* editor */
#editor{position:absolute;inset:0;z-index:70;background:#fdf4ff;display:none}
#editor.open{display:flex}
.edprev{flex:0 0 36%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 70%,#fbcfe8,#e9d5ff);padding:10px;gap:8px}
.edprev .pv{height:62%;display:flex;align-items:flex-end;justify-content:center}
.edprev .pv svg{height:100%;width:auto}
.edprev input{font-family:inherit;font-size:22px;font-weight:800;border:3px solid #c084fc;border-radius:14px;padding:6px 10px;width:90%;text-align:center;color:#6b21a8}
.edopts{flex:1;overflow-y:auto;padding:10px 14px 30px}
.edopts h3{margin:12px 0 4px;color:#7c3aed;font-size:19px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.swb{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0002}
.swb.on{box-shadow:0 0 0 4px #7c3aed}
.chb{background:#fff;border:3px solid #ede9fe;border-radius:14px;padding:4px 10px;font-weight:700;font-size:16px;min-height:48px}
.chb.on{border-color:#7c3aed;background:#f3e8ff}
.chb svg{width:46px;height:46px;display:block;margin:0 auto}
.edbtns{display:flex;gap:8px;width:90%}
.edbtns button{flex:1}
input[type=range]{width:100%;height:40px;accent-color:#7c3aed}
@media (max-width:700px){.bbtn{font-size:14px}.bbtn span{font-size:22px}#title{font-size:18px}.tbtn{padding:0 10px;font-size:16px}#editor{flex-direction:column}.edprev{flex:0 0 40%}}
@media (orientation:portrait){#editor{flex-direction:column}.edprev{flex:0 0 38%}}

function bedType(it){return it.big||(EMO3D[it.k]&&EMO3D[it.k][0]);}
function bedsIn(b,fi){return b.floors[fi].items.filter(it=>it.y>=46&&['bed','sofa'].includes(bedType(it)));}
function isFree(it,self){return !S.ents.some(o=>o!==self&&o.sleep&&o.bed===it.id);}
function placeOn(e,it){e.x=it.x;e.y=Math.max(46.5,it.y-2.5);e.sleep=true;e.bed=it.id;const aa=((angOf(it)%360)+360)%360;e.sr=!!it.fl!==(aa>135&&aa<225);}
function nearestOf(list,e){let best=null,bd=1e9;list.forEach(it=>{const d=Math.hypot(it.x-e.x,it.y-e.y);if(d<bd){bd=d;best=it;}});return best;}

  for(let fi=0;fi<b.floors.length;fi++){if(fi===V.f)continue;const l=bedsIn(b,fi).filter(it=>isFree(it,e));
   if(l.length){const it=l[0];const ch=chain(b);let role;
    if(b.floors[V.f].side)role='back';else if(b.floors[fi].side)role=V.f===0?'side':null;else role='lift';
    const fx=role&&document.querySelector(`.fix[data-role="${role}"]`);const tx=fx?+fx.dataset.lx:e.x;if(role==='lift')liftOpen(true);
    toast(e.name+' geht '+bedName(it)+': '+floorLabel(fi,b.floors[fi]));
    walkTo(e,tx,fx?(role==='lift'?47.2:49):e.y,()=>{e.loc={b:b.id,f:fi};placeOn(e,it);if(V.sel===e.id)V.sel=null;save();liftOpen(false);setTimeout(()=>{renderRoom();renderAction();},500);});return;}}
 }else{let best=null;
  S.buildings.forEach(b=>!b.remote&&b.floors.forEach((fl,fi)=>bedsIn(b,fi).forEach(it=>{if(!isFree(it,e))return;const d=BT[b.t];const dist=Math.hypot(b.x+d.w/2-e.x,b.y+d.h-e.y);if(!best||dist<best.dist)best={b,fi,it,dist};})));
  if(best){const d=BT[best.b.t];toast(e.name+' geht schlafen: '+d.n+' 🛏️');walkTo(e,best.b.x+d.w/2,best.b.y+d.h-4,()=>{e.loc={b:best.b.id,f:best.fi};placeOn(e,best.it);if(V.sel===e.id)V.sel=null;save();if(V.mode==='map')render();});return;}
 }
 e.sleep=true;e.bed=null;e.sr=false;refreshEnt(e);toast(e.name+' schläft hier 💤 (kein freies Bett)');save();renderAction();
}
const SEATS=['chair','seat','sofa','bench'];
function seatsIn(b,fi){return b.floors[fi].items.filter(it=>it.y>=46&&SEATS.includes(bedType(it)));}
function seatUsers(it,self){return S.ents.filter(o=>o!==self&&o.sit&&o.bed===it.id).length;}
function seatCap(it){return ['sofa','bench'].includes(bedType(it))?2:1;}
function placeSit(e,it){const n=seatUsers(it,e);const cap=seatCap(it);const off=cap>1?(n===0?-3.2:3.2)*it.s:0;e.x=it.x+off;e.y=Math.max(46.5,it.y-1);e.sit=true;e.sleep=false;e.swim=false;e.bed=it.id;}

  if(l.length){const it=nearestOf(l,e);walkTo(e,it.x,Math.min(99,it.y+1.5),()=>{placeSit(e,it);refreshEnt(e);renderAction();save();});return;}}

 const step=now=>{if(e._aid!==id)return;const p=Math.min(1,(now-t0)/ms),n=keys.length-1,i=Math.min(n-1,Math.floor(p*n)),f=p*n-i;const a=keys[i]+(keys[i+1]-keys[i])*(f<0.5?2*f*f:1-2*(1-f)*(1-f));setPAng(e,a);if(p<1)requestAnimationFrame(step);else setPAng(e,keys[n]);};requestAnimationFrame(step);}

let T=lsGet(TKEY)||{days:{},lockedUntil:null,lockFrom:null,pen:0,weekExt:null};
if(T.lockedUntil&&!T.lockFrom){T.lockFrom=addDaysEarly(T.lockedUntil,-1);}
function addDaysEarly(k,n){const [y,m,d]=k.split('-').map(Number);const dt=new Date(y,m-1,d+n);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
const isLockedDay=k=>!!(T.lockedUntil&&T.lockFrom&&k>=T.lockFrom&&k<=T.lockedUntil);
function saveTime(){lsSet(TKEY,T);}
const pad=n=>String(n).padStart(2,'0');
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(k,n){const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n));}
function weekKey(k){const [y,m,d]=k.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d));const day=dt.getUTCDay()||7;dt.setUTCDate(dt.getUTCDate()+4-day);const ys=new Date(Date.UTC(dt.getUTCFullYear(),0,1));return dt.getUTCFullYear()+'-W'+Math.ceil(((dt-ys)/86400000+1)/7);}
function dayName(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});}
function todayState(){
 const k=dkey(new Date());
 if(isLockedDay(k))return {k,locked:true};
 let r=T.days[k];
 if(!r){const y=addDays(k,-1);const yLocked=isLockedDay(y);const hist=Object.keys(T.days).length>0;
  const bonus=(hist&&!yLocked&&!(T.days[y]&&T.days[y].used>0))?15:0;
  const pen=T.pen||0;r=T.days[k]={used:0,allow:Math.max(0,30+bonus-pen),bonus,pen,e15:false,e30:false};T.pen=0;
  const keys=Object.keys(T.days).sort();while(keys.length>40)delete T.days[keys.shift()];saveTime();}
 return {k,r,locked:false};
}
function remaining(st){return st.r.allow*60-st.r.used;}
let playing=false,warned5=false,warned1=false,tickN=0;
setInterval(()=>{
 if(!playing||document.visibilityState!=='visible')return;
 const st=todayState();
 if(st.locked){playing=false;showStart();return;}
 st.r.used++;tickN++;if(tickN%5===0)saveTime();
 const rem=remaining(st);updateClock(rem);
 if(rem<=300&&rem>290&&!warned5){warned5=true;toast('⏰ Noch 5 Minuten! Bring deine Figuren ins Bett 🛏️');}
 if(rem<=60&&!warned1){warned1=true;toast('⏰ Noch 1 Minute!');}
 if(rem<=0){saveTime();playing=false;showEnd();}
},1000);

function b64FromBuf(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function bufFromB64(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function exportCode(){const json=JSON.stringify(S);
 try{const st=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));const buf=await new Response(st).arrayBuffer();return 'STERN1:'+b64FromBuf(buf);}
 catch(e){return 'STERN0:'+btoa(unescape(encodeURIComponent(json)));}}
async function importCode(code){code=(code||'').replace(/\s+/g,'');let json;
 if(code.startsWith('STERN1:')){const st=new Blob([bufFromB64(code.slice(7))]).stream().pipeThrough(new DecompressionStream('gzip'));json=await new Response(st).text();}
 else if(code.startsWith('STERN0:'))json=decodeURIComponent(escape(atob(code.slice(7))));
 else throw new Error('kein Code');
 const d=JSON.parse(json);if(!d||d.v!==1||!Array.isArray(d.buildings)||!Array.isArray(d.ents))throw new Error('ungültig');return d;}

function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return;}const sc=document.createElement('script');sc.src=src;sc.onload=()=>res();sc.onerror=()=>rej(new Error('load'));document.head.appendChild(sc);});}
const QR=(()=>{
 const ECC=[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30];
 const BLK=[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25];
 const rawMods=v=>{let r=(16*v+128)*v+64;if(v>=2){const na=Math.floor(v/7)+2;r-=(25*na-10)*na-55;if(v>=7)r-=36;}return r;};
 const dataCW=v=>Math.floor(rawMods(v)/8)-ECC[v]*BLK[v];
 const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z;};
 const rsDiv=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<r.length;j++){r[j]=mul(r[j],root);if(j+1<r.length)r[j]^=r[j+1];}root=mul(root,2);}return r;};
 const rsRem=(data,dv)=>{const r=dv.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);dv.forEach((c,i)=>r[i]^=mul(c,f));}return r;};
 function encode(text,fm){
  const bytes=Array.from(new TextEncoder().encode(text));let ver=1;
  for(;ver<=40;ver++){if(4+(ver<10?8:16)+bytes.length*8<=dataCW(ver)*8)break;}
  if(ver>40)throw new Error('zu lang');
  const bb=[];const app=(v,n)=>{for(let i=n-1;i>=0;i--)bb.push((v>>>i)&1);};
  app(4,4);app(bytes.length,ver<10?8:16);bytes.forEach(b=>app(b,8));
  const cap=dataCW(ver)*8;app(0,Math.min(4,cap-bb.length));app(0,(8-bb.length%8)%8);for(let pd=0xEC;bb.length<cap;pd^=0xEC^0x11)app(pd,8);
  const data=[];for(let i=0;i<bb.length;i+=8){let v=0;for(let j=0;j<8;j++)v=(v<<1)|bb[i+j];data.push(v);}
  const nb=BLK[ver],ecl=ECC[ver],raw=Math.floor(rawMods(ver)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),dv=rsDiv(ecl),blocks=[];let k=0;
  for(let i=0;i<nb;i++){const dat=data.slice(k,k+shortLen-ecl+(i<nShort?0:1));k+=dat.length;const ecc=rsRem(dat,dv);if(i<nShort)dat.push(0);blocks.push(dat.concat(ecc));}
  const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((bl,j)=>{if(i!==shortLen-ecl||j>=nShort)all.push(bl[i]);});
  const size=ver*4+17,M=[...Array(size)].map(()=>Array(size).fill(false)),F=[...Array(size)].map(()=>Array(size).fill(false));
  const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true;};
  for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
  const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)set(xx,yy,d!==2&&d!==4);}};
  finder(3,3);finder(size-4,3);finder(3,size-4);
  const ap=[];if(ver>1){const na=Math.floor(ver/7)+2,step=Math.floor((ver*8+na*3+5)/(na*4-4))*2;for(let i=0;i<na-1;i++)ap.unshift(size-7-i*step);ap.unshift(6);}
  ap.forEach((a,i)=>ap.forEach((b,j)=>{if((i===0&&j===0)||(i===0&&j===ap.length-1)||(i===ap.length-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}));

   for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true);};

 if(!NET.dc){friendsOverlay(`<div class="logo">🤝</div><h2>Mit einem anderen Tablet spielen</h2><p style="font-size:16px">Beide Tablets müssen im <b>selben WLAN</b> sein. Ein Tablet lädt ein, das andere scannt.</p>
   <button class="bigbtn b3" id="fInv">📨 Ich lade ein<small>Zeigt einen QR-Code</small></button><button class="bigbtn" id="fScan">📷 Einladung scannen<small>Mit der Kamera den Code vom anderen Tablet lesen</small></button><button class="bigbtn b4" id="fX">Schließen</button>`);
  $('#fInv').onclick=()=>{pop();closeFriends();hostInvite();};$('#fScan').onclick=()=>{pop();closeFriends();guestScan();};$('#fX').onclick=()=>{pop();closeFriends();};return;}
 tab=tab||'main';
 if(tab==='main'){const away=S.ents.filter(e=>e.away),vis=S.ents.filter(e=>e.visitor);
  friendsOverlay(`<div class="logo">🤝</div><h2>Verbunden!</h2>
   <button class="bigbtn b3" id="fVisit">🚪 Auf Besuch schicken</button><button class="bigbtn b2" id="fGift">🎁 Geschenk schicken</button><button class="bigbtn" id="fEmo">📞 Emoji schicken</button>
   ${V.mode==='room'&&!String(V.b).startsWith('R:')?'<button class="bigbtn b3" id="fHouse">🏠 Dieses Haus gemeinsam einrichten</button>':''}<button class="bigbtn b2" id="fParty">🎉 Party – alle tanzen!</button>
   ${away.length?`<p style="margin-top:12px"><b>Gerade auf Besuch:</b></p><div class="row" style="justify-content:center">${away.map(e=>`<button class="chb" data-recall="${e.id}">${esc(e.name)} – 🏠 zurückholen</button>`).join('')}</div>`:''}
   ${vis.length?`<p style="margin-top:12px"><b>Besuch bei dir:</b> ${vis.map(e=>esc(e.name.replace(' (Besuch)',''))).join(', ')}</p>`:''}
   <button class="bigbtn b4" id="fBye">🔌 Verbindung trennen</button><button class="bigbtn b4" id="fX">Schließen</button>`);
  $('#fVisit').onclick=()=>{pop();showFriends('visit');};$('#fGift').onclick=()=>{pop();showFriends('gift');};$('#fEmo').onclick=()=>{pop();showFriends('emo');};
  const fh=$('#fHouse');if(fh)fh.onclick=()=>{pop();inviteHouse();closeFriends();};
  $('#fParty').onclick=()=>{if(netSend({t:'party'})){closeFriends();party();}};
  document.querySelectorAll('[data-recall]').forEach(b=>b.onclick=()=>{pop();netSend({t:'recall',id:b.dataset.recall});toast('Ruft nach Hause …');});
  $('#fBye').onclick=()=>{pop();peerClose();};$('#fX').onclick=()=>{pop();closeFriends();};return;}
 const back='<button class="bigbtn b4" id="fBack">Zurück</button>';
 if(tab==='visit'){const list=entsHere().filter(e=>!e.visitor);
  friendsOverlay(`<h2>🚪 Wer geht auf Besuch?</h2>${list.length?`<div class="dgrid" style="max-height:46vh">${list.map(e=>`<button class="cell" data-v="${e.id}">${e.kind==='person'?`<div style="width:46px;height:46px">${personSVG(e.L,true)}</div>`:`<div class="ic">${(ANIMALS[e.a]||{}).e||'🐾'}</div>`}<div>${esc(e.name)}</div></button>`).join('')}</div>`:'<p>Hier ist gerade niemand. Geh dorthin, wo deine Figuren sind.</p>'}${back}`);
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const e=eById(b.dataset.v);if(e){sendVisit(e);showFriends();}});}
 if(tab==='gift'){friendsOverlay(`<h2>🎁 Was möchtest du schenken?</h2><div class="dgrid" style="max-height:46vh">${GIFTS.map(k=>`<button class="cell" data-g="${k}"><div class="ic">${k}</div></button>`).join('')}${GIFT_ANIMALS.map(a=>`<button class="cell" data-ga="${a}"><div class="ic">${ANIMALS[a].e||'🐾'}</div><div>${ANIMALS[a].n}</div></button>`).join('')}</div>${back}`);
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{sendGift({k:b.dataset.g});showFriends();});document.querySelectorAll('[data-ga]').forEach(b=>b.onclick=()=>{sendGift({a:b.dataset.ga});showFriends();});}
 if(tab==='emo'){const EM='👋 😊 😂 😍 🥳 😮 😴 🤗 👍 ❤️ ⭐ 🌈 🍕 🎵 🐶 🎉'.split(' ');
  friendsOverlay(`<h2>📞 Emoji schicken</h2><div class="dgrid">${EM.map(k=>`<button class="cell" data-e="${k}"><div class="ic">${k}</div></button>`).join('')}</div>${back}`);
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{if(netSend({t:'emoji',e:b.dataset.e})){pop(900);toast('📞 Gesendet: '+b.dataset.e);}});}
 const fb=$('#fBack');if(fb)fb.onclick=()=>{pop();showFriends();};
}
function showRules(){
 const st=todayState();const wk=weekKey(st.k);
 showScreen(`<div class="card rules"><h2>ℹ️ So geht's</h2><ul>
 <li>🏗️ <b>Bauen</b>: Haus antippen, es erscheint auf der Karte. Mit dem Finger verschieben.</li>
 <li>🚪 Haus <b>antippen</b> = reingehen. Mit dem <b>Aufzug</b> 🛗 in eine andere Etage.</li>
 <li>🧑 Figuren und Tiere mit dem Finger <b>ziehen</b>. Oder antippen und dann auf eine Stelle tippen – dann laufen sie hin.</li>
 <li>🏠 Figur auf ein Haus ziehen = sie geht hinein. In den Aufzug ziehen = sie fährt mit.</li>
 <li>🛏️ Figur aufs Bett ziehen = sie schläft. Auf Stuhl oder Sofa = sie setzt sich. In den Pool = sie schwimmt.</li>
 <li>🐾 Tier antippen und 🐾 drücken = es läuft der nächsten Figur hinterher.</li>
 <li>🤝 <b>Mit einem anderen Tablet spielen</b> (gleiches WLAN): oben auf 🤝 tippen. Ein Tablet lädt ein, das andere scannt. Dann könnt ihr Figuren auf Besuch schicken, Geschenke und Emojis senden, ein Haus gemeinsam einrichten oder eine Party feiern.</li>
 <li>🗑️ Etwas weg haben? In den Mülleimer ziehen.</li>
 </ul><h2>⏰ Spielzeit</h2><ul>
 <li>Jeden Tag <b>30 Minuten</b>.</li>
 <li>Einmal am Tag <b>+15 Minuten</b> verlängern – dann ist der nächste Tag 15 Minuten kürzer.</li>
 <li>Einen Tag nicht gespielt? Am nächsten Tag gibt's <b>+15 Bonus-Minuten</b>.</li>
 <li>Einmal pro Woche <b>+30 Minuten</b> extra – dann sind die nächsten <b>2 Tage Pause</b>.</li>
 </ul><p style="font-size:16px">Wochen-Extra diese Woche: ${T.weekExt===wk?'schon benutzt':'noch frei'}${st.r?' · +15 heute: '+(st.r.e15?'schon benutzt':'noch frei'):''}</p>
 <button class="bigbtn b3" id="rbBack">Zurück</button></div>`);
 $('#rbBack').onclick=()=>{pop();showStart();};
}
function showEnd(){
 if(typeof peerClose==='function'&&NET.dc)peerClose(true);
 lsSet(SKEY,S);closeDrawer();
 const st=todayState();if(st.locked){showStart();return;}
 const wk=weekKey(st.k);let btns='';
 if(!st.r.e15)btns+=`<button class="bigbtn b2" id="e15">⏰ +15 Minuten<small>Morgen hast du dann 15 Minuten weniger</small></button>`;
 if(T.weekExt!==wk)btns+=`<button class="bigbtn b3" id="e30">⭐ +30 Minuten Wochen-Extra<small>Danach sind 2 Tage Pause</small></button>`;
 btns+=`<button class="bigbtn" id="bye">👋 Tschüss, bis bald!</button>`;
 showScreen(`<div class="card"><div class="logo">🌙</div><h2>Die Spielzeit für heute ist um!</h2><p>Super gespielt! Deine Stadt ist gespeichert.</p>${btns}</div>`);
 const e15=$('#e15');if(e15)e15.onclick=()=>{pop();const s=todayState();s.r.allow+=15;s.r.e15=true;T.pen=(T.pen||0)+15;saveTime();warned5=warned1=false;hideScreen();updateClock(remaining(s));};
 const e30=$('#e30');if(e30)e30.onclick=()=>{pop();const k=dkey(new Date());
  dialog(`<h2>Wirklich +30 Minuten?</h2><p>Dann ist am <b>${dayName(addDays(k,1))}</b> und <b>${dayName(addDays(k,2))}</b> Pause.</p>`,[['Ja, 30 Minuten weiter',()=>{const s=todayState();s.r.allow+=30;s.r.e30=true;T.weekExt=weekKey(s.k);T.lockFrom=addDays(s.k,1);T.lockedUntil=addDays(s.k,2);saveTime();warned5=warned1=false;hideScreen();updateClock(remaining(s));},'b3'],['Nein, lieber nicht',null,'b4']]);};
 $('#bye').onclick=()=>{pop();showScreen(`<div class="card"><div class="logo">👋</div><h2>Tschüss!</h2><p>Deine Stadt ist gespeichert und wartet auf dich.<br>Bis zum nächsten Mal! 💜</p><button class="bigbtn b4" id="rulesBtn2">ℹ️ Spielzeit-Regeln</button></div>`);$('#rulesBtn2').onclick=showRules;};
}

/* ---------------- Start ---------------- */
$('#backBtn').onclick=()=>{pop();goMap();};
$('#friendBtn').onclick=()=>{pop();showFriends();};
$('#todBtn').onclick=()=>{const i=TODS.findIndex(t=>t[0]===S.tod);S.tod=TODS[(i+1)%4][0];applyTod();camDirty=true;pop(300+i*120);save();};
$('#muteBtn').onclick=()=>{S.muted=!S.muted;$('#muteBtn').textContent=S.muted?'🔇':'🔊';save();pop();};
window.addEventListener('resize',()=>{if(V.mode==='room')setU();else{mapDims();}});
load();applyTod();$('#muteBtn').textContent=S.muted?'🔇':'🔊';
render();requestAnimationFrame(mapTick);
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
showStart();
</script>
